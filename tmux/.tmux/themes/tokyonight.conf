# TokyoNight Storm theme for tmux
# Palette: https://github.com/folke/tokyonight.nvim/blob/main/extras/tmux/tokyonight_storm.tmux

bg="#24283b"
default_fg="#c0caf5"
session_fg="#7aa2f7"
session_selection_fg="#1d202f"
session_selection_bg="#bb9af7"
active_window_fg="#7aa2f7"
active_pane_border="#7aa2f7"
inactive_pane_border="#3b4261"
status_fg="#a9b1d6"
accent_blue="#7aa2f7"
accent_purple="#bb9af7"
accent_green="#9ece6a"
accent_pink="#bb9af7"
accent_cyan="#7dcfff"
accent_orange="#ff9e64"

set -g status-left-length 200
set -g status-right-length 200
set -g status-left "#[fg=${session_fg},bg=${bg},bold] #S #[default]"
# macOS: keyboard layout, interface and VPN come from HIToolbox/route/scutil,
# volume from osascript. The Linux equivalents (hyprctl, ip, nmcli, pactl) are
# absent here and only left empty segments in the bar.
set -g status-right "#{?client_prefix,#[reverse]<Prefix>#[noreverse] ,}#[fg=${accent_cyan}]#(defaults read ~/Library/Preferences/com.apple.HIToolbox.plist AppleSelectedInputSources 2>/dev/null | sed -n '/KeyboardLayout Name/s/.*= *//p' | tr -d ';\"' | head -1) #[fg=${status_fg},bg=${bg}]#(~/.tmux/kube.sh)| #[fg=${accent_purple}]#(route -n get default 2>/dev/null | awk '/interface:/ {print $2}')#[fg=${accent_green}]#(scutil --nc list 2>/dev/null | grep Connected | grep -E 'VPN|wireguard' | awk -F'\"' '{print \" | \"$2}' | head -1) #[fg=${status_fg},bg=${bg}]| #[fg=${accent_green}]#(~/.tmux/volume.sh) #[fg=${status_fg},bg=${bg}]| #[fg=${accent_blue},bg=${bg}]%Y-%m-%d #[fg=${status_fg},bg=${bg}]| #[fg=${accent_green},bg=${bg}]%H:%M #[fg=${status_fg},bg=${bg}]| #[fg=${active_window_fg},bg=${bg}]#(~/.tmux/battery.sh)"
set -g status-justify left
set -g status-style "bg=${bg}"
set -g window-status-format "#[fg=${default_fg},bg=default] #W"
set -g window-status-current-format "#[fg=${active_window_fg},bold,bg=default] #W"
set -g window-status-last-style "fg=${default_fg},bg=default"
set -g message-command-style "bg=default,fg=${default_fg}"
set -g message-style "bg=default,fg=${default_fg}"
set -g popup-style "bg=${bg},fg=${default_fg}"
set -g popup-border-style "fg=${inactive_pane_border}"
set -g popup-border-lines rounded
set -g mode-style "bg=${session_selection_bg},fg=${session_selection_fg}"
set -g pane-active-border-style "fg=${active_pane_border},bg=default"
set -g pane-border-style "fg=${inactive_pane_border},bg=default"
