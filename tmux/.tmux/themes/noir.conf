# Neovim Default colorscheme for tmux (macOS)
# Based on Neovim's default dark colorscheme (src/nvim/highlight_group.c)

bg="#14161b"
default_fg="#e0e2ea"
session_selection_fg="#07080d"
session_selection_bg="#8cf8f7"
active_window_fg="#8cf8f7"
active_pane_border="#8cf8f7"
inactive_pane_border="#4f5258"
status_fg="#9b9ea4"
accent_cyan="#8cf8f7"
accent_blue="#a6dbff"
accent_magenta="#aa0008"
accent_green="#b3f6c0"

set -g status-left-length 200
set -g status-right-length 200
set -g status-left ""
set -g status-right "#{?client_prefix,#[reverse]<Prefix>#[noreverse] ,}#[fg=blue,bg=default]  #[fg=${default_fg},bg=default]#(~/.tmux/kube.sh)#[fg=${default_fg},bg=default] | #[fg=${accent_magenta},bg=default]#(route -n get default | grep interface | awk '{print $2}')#[fg=${accent_blue},bg=default]#(scutil --nc list | grep Connected | grep -E 'VPN|wireguard' | awk -F'\"' '{print \" | \"$2}' | head -1) #[fg=${default_fg},bg=default]|#[fg=${accent_cyan},bg=default] %Y-%m-%d #[fg=${default_fg},bg=default]|#[fg=${accent_green},bg=default] %H:%M #[fg=${default_fg},bg=default]| #[fg=${accent_magenta},bg=default]#(~/.tmux/battery.sh)"
set -g status-justify left
set -g status-style "bg=default,fg=${default_fg}"
set -g window-status-format "#[fg=${default_fg},bg=default] #W"
set -g window-status-current-format "#[fg=${active_window_fg},bold,bg=default] #W"
set -g window-status-last-style "fg=${default_fg},bg=default"
set -g message-command-style "bg=default,fg=${default_fg}"
set -g message-style "bg=default,fg=${default_fg}"
set -g mode-style "bg=${session_selection_bg},fg=${session_selection_fg}"
set -g pane-active-border-style "fg=${active_pane_border},bg=default"
set -g pane-border-style "fg=${inactive_pane_border},bg=default"
