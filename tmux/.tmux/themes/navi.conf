# Navi colorscheme for tmux
# Extracted from elio examples/themes/navi/theme.toml

bg="#02050c"
default_fg="#edf4ff"
session_fg="#95d3ff"
session_selection_fg="#eaf5ff"
session_selection_bg="#204064"
active_window_fg="#7ec4ff"
active_pane_border="#7ec4ff"
inactive_pane_border="#35506f"
status_fg="#8ea2bf"
accent_cyan="#7ec4ff"
accent_blue="#95d3ff"
accent_magenta="#95d3ff"
accent_green="#57c957"

set -g status-left-length 200
set -g status-right-length 200
set -g status-left ""
set -g status-right "#{?client_prefix,#[reverse]<Prefix>#[noreverse] ,} #[fg=${accent_green}]#(hyprctl devices -j | jq -r '.keyboards[] | select(.main == true) | .active_keymap' | sed 's/English (US)/US/; s/Russian/RU/') #[fg=${status_fg},bg=${bg}]#(~/.tmux/kube.sh)#[fg=default]| #[fg=${accent_magenta}]#(ip route | grep default | awk '{print $5}' | head -1)#[fg=${accent_green}]#(nmcli connection show --active | grep -E 'vpn|tun|wireguard' | awk '{print \" | \"$1}' | head -1) #[fg=${status_fg},bg=${bg}]| #[fg=${accent_green}]  #(pactl get-sink-volume @DEFAULT_SINK@ | awk '{print $5}' | tr -d '%')% #[fg=${status_fg},bg=${bg}]| #[fg=${accent_blue},bg=${bg}]%Y-%m-%d #[fg=${status_fg},bg=${bg}]| #[fg=${accent_green},bg=${bg}]%H:%M #[fg=${status_fg},bg=${bg}]"
set -g status-justify left
set -g status-style "bg=${bg}"
set -g window-status-format "#[fg=${default_fg},bg=default] #W"
set -g window-status-current-format "#[fg=${active_window_fg},bold,bg=default] #W"
set -g window-status-last-style "fg=${default_fg},bg=default"
set -g message-command-style "bg=default,fg=${default_fg}"
set -g message-style "bg=default,fg=${default_fg}"
set -g mode-style "bg=${session_selection_bg},fg=${session_selection_fg}"
set -g pane-active-border-style "fg=${active_pane_border},bg=default"
set -g pane-border-style "fg=${inactive_pane_border},bg=default"
