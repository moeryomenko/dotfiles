# vim:filetype=dosini
# hyprtoolkit theme — noir palette
#
# hyprlauncher and other hyprtoolkit apps read this file.
# Color format: 0xAARRGGBB
#
# noir palette reference:
#   background       = 0xFF14161b  — dark bg
#   base             = 0xFF2c2e33  — lighter bg
#   alternate_base   = 0xFF4f5258  — even lighter
#   text             = 0xFFe0e2ea  — soft off-white fg
#   bright_text      = 0xFFeef1f8  — bright white
#   link_text        = 0xFFa6dbff  — blue
#   accent           = 0xFF8cf8f7  — cyan
#   accent_secondary = 0xFFb3f6c0  — mint green

# Core backgrounds
background     = 0xFF14161b  # noir background — dark bg
base           = 0xFF2c2e33  # noir base — lighter bg
alternate_base = 0xFF4f5258  # noir alternate_base — even lighter

# Text
text       = 0xFFe0e2ea  # noir text — soft off-white fg
bright_text = 0xFFeef1f8 # noir bright_text — bright white
link_text   = 0xFFa6dbff # noir link_text — blue

# Accents
accent           = 0xFF8cf8f7  # noir accent — cyan (primary)
accent_secondary = 0xFFb3f6c0  # noir accent_secondary — mint green (secondary)
