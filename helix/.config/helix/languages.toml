[language-server.autotools-language-server]
command = "autotools-language-server"

[language-server.make-ls]
command = "make-ls"

[language-server.css-variable-lsp]
command = "css-variable-lsp"
args = []

[[language]]
name = "css"
language-servers = ["css-lsp", "css-variable-lsp"]

[[language]]
name = "scss"
language-servers = ["css-lsp", "css-variable-lsp"]

[[language]]
name = "autoconf"
scope = "source.autoconf"
file-types = ["configure.ac"]
language-servers = ["autotools-language-server"]

[[language]]
name = "make"
language-servers = ["make-ls"]

# SELinux Type Enforcement policy modules (.te) and interface files (.if).
# Grammar: https://github.com/moeryomenko/tree-sitter-selinux
[[language]]
name = "selinux-te"
scope = "source.selinux-te"
file-types = ["te", "if"]
comment-token = "#"
indent = { tab-width = 4, unit = "    " }

[language.auto-pairs]
"(" = ")"
"{" = "}"
"`" = "'"

[[grammar]]
name = "selinux-te"
source = { git = "https://github.com/moeryomenko/tree-sitter-selinux", rev = "dc813009a179083dcefc111bb2bc19418e50ab5c" }

# ---------------------------------------------------------------------------
# jq / JSON language servers
# ---------------------------------------------------------------------------

# jq (https://github.com/wader/jq-lsp). Helix already defaults to jq-lsp; the
# definition is repeated here so the dependency is explicit.
[language-server.jq-lsp]
command = "jq-lsp"

[[language]]
name = "jq"
language-servers = ["jq-lsp"]

# JSON (vscode-json-language-server from vscode-langservers-extracted,
# Arch package: vscode-json-languageserver).
[language-server.vscode-json-language-server]
command = "vscode-json-language-server"
args = ["--stdio"]
config = { provideFormatter = true, json = { validate = { enable = true } } }

[[language]]
name = "json"
language-servers = ["vscode-json-language-server"]

[[language]]
name = "jsonc"
language-servers = ["vscode-json-language-server"]

# ---------------------------------------------------------------------------
# Assembly
# ---------------------------------------------------------------------------
# Helix's built-in `gas` (.s) and `nasm` (.asm/.S/.nasm) languages already use
# asm-lsp with its default configuration (GAS, host instruction set).
#
# Go assembly needs a different asm-lsp assembler, and asm-lsp accepts no CLI
# flag or initializationOptions: it reads $XDG_CONFIG_HOME/asm-lsp/.asm-lsp.toml.
# `asm-lsp-go` is a thin wrapper that points XDG_CONFIG_HOME at a Go-specific
# config tree, so both flavours can coexist.
[language-server.asm-lsp-go]
command = "asm-lsp-go"

# Go assembly files end in _<GOARCH>.s. A glob match is checked before (and
# wins over) the generic .s extension mapping, so these files get the Go
# server while other .s files stay on the GAS server.
[[language]]
name = "go-asm"
scope = "source.go-asm"
file-types = [
  { glob = "*_386.s" },
  { glob = "*_amd64.s" },
  { glob = "*_arm.s" },
  { glob = "*_arm64.s" },
  { glob = "*_loong64.s" },
  { glob = "*_mips.s" },
  { glob = "*_mips64.s" },
  { glob = "*_mips64le.s" },
  { glob = "*_mipsle.s" },
  { glob = "*_ppc64.s" },
  { glob = "*_ppc64le.s" },
  { glob = "*_riscv64.s" },
  { glob = "*_s390x.s" },
  { glob = "*_wasm.s" },
]
roots = ["go.work", "go.mod"]
comment-token = "//"
indent = { tab-width = 4, unit = "\t" }
# Parsed with the GAS grammar until a dedicated Go assembly grammar is added;
# queries live in runtime/queries/go-asm.
grammar = "gas"
language-servers = ["asm-lsp-go"]
